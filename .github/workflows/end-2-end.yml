name: End-2-end

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - PHP_VERSION: php83-fpm
            MAGEOS_VERSION: 2.3.0
          - PHP_VERSION: php85-fpm
            MAGEOS_VERSION: 3.3.0
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: ${{ matrix.PHP_VERSION }}
      MAGEOS_VERSION: ${{ matrix.MAGEOS_VERSION }}
      BASE_URL: http://magento.test/
      COMPOSE_FILE: .github/workflows/templates/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      # WireMock replaces the call to Anthropic, so no API key is ever needed.
      - name: Start the containers
        run: |
          docker compose -f $COMPOSE_FILE up -d --quiet-pull
          timeout 90 bash -c 'until docker exec wiremock curl -sf http://localhost:8080/__admin/health > /dev/null; do sleep 2; done'

      - name: Upload the module into the Mage-OS container
        run: |
          sed -i '/version/d' ./composer.json
          docker cp $(pwd) mage-os-community-edition:/data/extensions/
          docker exec mage-os-community-edition ./install-composer-package maggy-assistant/magento2-base:@dev

      - name: Activate the extension
        run: |
          docker exec mage-os-community-edition ./retry "php bin/magento module:enable MaggyAssistant_Base"
          # Its modal covers the whole admin on first login and swallows every click.
          docker exec mage-os-community-edition ./retry "php bin/magento module:disable Magento_AdminAnalytics"
          docker exec mage-os-community-edition ./retry "php bin/magento setup:upgrade --keep-generated --no-interaction"

      - name: Configure Mage-OS
        run: |
          docker exec mage-os-community-edition /bin/bash ./change-base-url $BASE_URL
          docker exec mage-os-community-edition /bin/bash ./disable-2fa
          docker exec mage-os-community-edition ./retry "bin/magento config:set maggy/general/enabled 1"
          docker exec mage-os-community-edition ./retry "bin/magento config:set maggy/api/provider claude"
          docker exec mage-os-community-edition ./retry "bin/magento config:set maggy/api/claude_base_url http://wiremock:8080/v1/messages"
          # Stream.php refuses to run without a key. WireMock never checks it.
          docker exec mage-os-community-edition ./retry "bin/magento config:set maggy/api/claude_api_key not-a-real-key"
          # One admin session is shared by every parallel worker.
          docker exec mage-os-community-edition ./retry "bin/magento config:set admin/security/admin_account_sharing 1"
          docker exec mage-os-community-edition ./retry "bin/magento config:set admin/security/session_lifetime 86400"
          docker exec mage-os-community-edition ./retry "bin/magento config:set web/cookie/cookie_lifetime 86400"

      - name: Prepare Mage-OS
        run: |
          sudo echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts
          docker exec mage-os-community-edition ./retry "php bin/magento setup:di:compile"
          # The image ships a deployed pub/static. -f only means "deploy in any mode", it does not
          # overwrite, so without this the module's LESS never reaches the theme's styles.css.
          docker exec mage-os-community-edition bash -c "rm -rf pub/static/adminhtml pub/static/deployed_version.txt var/view_preprocessed"
          docker exec mage-os-community-edition ./retry "php bin/magento setup:static-content:deploy -f"
          docker exec mage-os-community-edition ./retry "php bin/magento indexer:reindex"
          docker exec mage-os-community-edition ./retry "php bin/magento cache:flush"

      - name: Check that Mage-OS is reachable
        run: |
          curl --fail-with-body -v -w "%{http_code}" ${BASE_URL}
          curl --fail-with-body -v -w "%{http_code}" ${BASE_URL}admin

      - name: Install Playwright
        run: |
          cd Test/End-2-end
          npm install
          npx playwright install --with-deps chromium

      - name: Run the tests
        run: |
          cd Test/End-2-end
          FORCE_COLOR=true npx playwright test

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: E2E report - ${{ matrix.PHP_VERSION }} - mage-os ${{ matrix.MAGEOS_VERSION }}
          retention-days: 7
          path: |
            Test/End-2-end/playwright-report
            Test/End-2-end/test-results

      - name: Dump the logs
        if: failure()
        run: |
          docker compose -f $COMPOSE_FILE logs mage-os > mage-os.log
          docker compose -f $COMPOSE_FILE logs wiremock > wiremock.log

      - name: Upload the logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: E2E logs - ${{ matrix.PHP_VERSION }} - mage-os ${{ matrix.MAGEOS_VERSION }}
          retention-days: 7
          path: |
            mage-os-logs
            mage-os.log
            wiremock.log
